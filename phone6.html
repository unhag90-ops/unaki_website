<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>가상 폰</title>
<style>
:root{--bg:#fff;--fg:#111;--sub:#8a8a8e;--line:#e5e5ea;--card:#f2f2f7}
.dark{--bg:#000;--fg:#f5f5f5;--sub:#8e8e93;--line:#2c2c2e;--card:#1c1c1e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#1b1b1f;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;outline:0}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:#000;box-shadow:0 0 0 10px #2a2a2e,0 30px 80px #000a;color:var(--fg)}
@media(max-width:500px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
#sb{position:absolute;top:0;left:0;right:0;height:44px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-size:15px;font-weight:600;pointer-events:none;color:var(--fg)}
#sb.w{color:#fff}
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);color:var(--fg);padding-top:44px}
.scr.on{display:flex}
.hd{display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:48px;flex:none}
.hd .ti{flex:1;font-weight:700;font-size:17px;text-align:center}
.hd .bk,.hd .ab{font-size:26px;width:36px;line-height:1}
.hd .ab{font-size:20px;opacity:.4}.hd .ab.on{opacity:1}
.list{flex:1;overflow:auto}
.it{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.it .nm{font-weight:600}.it .sm,.sm{font-size:13px;color:var(--sub)}.it .sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.it .mid{flex:1;min-width:0}.it .rt{font-size:12px;color:var(--sub);text-align:right}
.av{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.badge{background:#ff3b30;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;display:inline-block;margin-top:3px}
.empty{padding:50px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);flex:none}
.tabs button{flex:1;padding:12px 0 22px;font-size:12px;color:var(--sub)}
.tabs button.on{color:var(--fg);font-weight:700}
#lock{color:#fff;align-items:center;justify-content:flex-start;padding-top:110px;cursor:pointer;text-shadow:0 1px 8px #0006;background-size:cover}
#lock .big{font-size:84px;font-weight:300;letter-spacing:-2px}
#lock .dt{font-size:19px;opacity:.95;margin-bottom:10px}
#home{color:#fff;padding:60px 18px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;flex:1;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer;text-shadow:0 1px 4px #0006}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 2px 6px #0003}
.dock{display:flex;justify-content:space-around;background:#fff3;backdrop-filter:blur(14px);border-radius:30px;padding:14px;margin:0 0 16px}
/* 스레드 공통 */
.body{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.day{align-self:center;font-size:12px;color:var(--sub);margin:12px 0}
.row{display:flex;align-items:flex-start;gap:8px;max-width:100%}
.row.gf{margin-top:8px}
.row.me{justify-content:flex-end;align-items:flex-end}
.col{display:flex;flex-direction:column;min-width:0;max-width:76%}
.line{display:flex;align-items:flex-end;gap:6px}
.nmx{font-size:13px;color:#4a5568;margin:0 0 4px 2px}
.avsp{width:34px;flex:none}
.bb{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.4;word-break:break-word;white-space:pre-wrap;position:relative;cursor:pointer}
.row.me .bb{max-width:76%}
.bb.imgb{padding:0;background:transparent!important;overflow:visible}
.mimg{display:block;max-width:240px;max-height:300px;border-radius:18px}
.tm{font-size:10px;color:var(--sub);flex:none;padding-bottom:2px}
.row .av{width:34px;height:34px;font-size:14px}
.inp{display:flex;align-items:center;gap:8px;padding:8px 12px 24px;border-top:1px solid var(--line);background:var(--bg)}
.inp input{flex:1;border:0;border-radius:22px;padding:11px 16px;background:var(--card)}
.inp .plus{font-size:28px;width:34px;color:var(--sub)}
.inp .send{width:38px;height:38px;border-radius:50%;font-size:20px;color:#fff}
.typing .bb{color:var(--sub);letter-spacing:3px}
.th-msg .me .bb{background:#0a84ff;color:#fff}.th-msg .row:not(.me) .bb{background:var(--card)}
.th-msg .send{background:#0a84ff}.th-msg .av,.th-msg .avsp{display:none}.th-msg .tm{display:none}
.th-insta .me .bb{background:#3797f0;color:#fff}.th-insta .row:not(.me) .bb{background:var(--card)}.th-insta .send{background:#3797f0}.th-insta .tm{display:none}
.th-x .me .bb{background:#1d9bf0;color:#fff}.th-x .row:not(.me) .bb{background:#eff3f4;color:#0f1419}.th-x .send{background:#1d9bf0}
.dark .th-x .row:not(.me) .bb{background:#2f3336;color:#e7e9ea}
/* 카카오톡 스타일 채팅방 */
.th-talk .hd{padding:10px 14px}
.th-talk .hd .bk{width:42px;height:42px;border-radius:50%;background:var(--card);font-size:24px;display:flex;align-items:center;justify-content:center}
.th-talk .hd .ti{font-size:19px;font-weight:800}
.th-talk .gear{width:42px;font-size:26px;color:#777}
.th-talk .body{background:#b9c7dc;padding:0 12px 10px}
.th-talk .day{background:rgba(0,0,0,.18);color:#fff;border-radius:14px;padding:4px 14px}
.th-talk .row .av,.th-talk .avsp{width:46px;height:46px;border-radius:40%;font-size:18px}
.th-talk .bb{font-size:16px;padding:10px 15px;border-radius:18px;color:#111}
.th-talk .me .bb{background:var(--me,#fee500)}
.th-talk .row:not(.me) .bb{background:var(--ot,#fff)}
.th-talk .bb.first::before{content:"";position:absolute;top:0;width:13px;height:13px;background:inherit}
.th-talk .row:not(.me) .bb.first{border-top-left-radius:4px}
.th-talk .row:not(.me) .bb.first::before{left:-6px;clip-path:polygon(100% 0,100% 100%,0 0)}
.th-talk .me .bb.first{border-top-right-radius:4px}
.th-talk .me .bb.first::before{right:-6px;clip-path:polygon(0 0,100% 0,0 100%)}
.th-talk .tm{color:#5b6b82;font-size:11px}
.th-talk .inp{padding:10px 14px 30px}
.th-talk .inp input{background:#f1f1f4;color:#111}
.th-talk .inp .send{background:none;color:#3a1d1d;font-size:28px}
.th-talk .inp .plus{color:#333;font-weight:300}
.dark .th-talk .inp input{background:#2a2a2d;color:#eee}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin-top:10px}
.keys button{height:76px;border-radius:50%;background:var(--card);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.keys small{font-size:9px;letter-spacing:2px;color:var(--sub)}
.dnum{height:56px;text-align:center;font-size:32px;padding-top:10px}
.callbtn{width:76px;height:76px;border-radius:50%;background:#34c759;color:#fff;font-size:30px;margin:14px auto;display:block}
#call,#incoming{background:linear-gradient(#2c3e50,#111);color:#fff;align-items:center;padding-top:80px}
#call h2,#incoming h2{font-size:32px;font-weight:500;margin-top:14px}
#cSt,#iSt{opacity:.7;margin-top:6px}
.cav{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
#cLines{flex:1;width:100%;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
#cLines div{padding:8px 13px;border-radius:16px;background:#fff2;max-width:80%;align-self:flex-start;font-size:15px}
#cLines div.me{align-self:flex-end;background:#0a84ff}
.cin{display:flex;gap:8px;width:100%;padding:0 18px}
.cin input{flex:1;background:#fff2;border:0;border-radius:20px;padding:9px 14px}
.cin button{width:38px;border-radius:50%;background:#0a84ff;font-size:18px}
.cbtns{display:flex;justify-content:center;gap:28px;padding:20px 0 40px}
.cbtns button{width:68px;height:68px;border-radius:50%;background:#fff2;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cbtns small{font-size:10px}.cbtns button.act{background:#fff;color:#000}
.cbtns .end{background:#ff3b30}.cbtns .ok{background:#34c759}
/* 인스타 */
.stories{display:flex;gap:12px;padding:12px;overflow:auto;border-bottom:1px solid var(--line)}
.stories>div{text-align:center;font-size:11px;flex:none;width:62px;cursor:pointer}
.stories .av{width:58px;height:58px;margin:0 auto 4px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #e1306c}
.post{border-bottom:1px solid var(--line);padding-bottom:10px}
.post img.ph{width:100%;max-height:440px;object-fit:cover;display:block;background:var(--card)}
.post .pt{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
.post .cap{padding:2px 12px;font-size:14px}.post .lk{padding:4px 12px;font-size:24px;cursor:pointer}
.post .lk.on{color:#ff3040}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.prof{display:flex;align-items:center;gap:20px;padding:16px}
.prof .st{flex:1;display:flex;justify-content:space-around;text-align:center;font-size:13px}.prof .st b{font-size:17px;display:block}
/* X */
.tw{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.twt{white-space:pre-wrap;font-size:15px;line-height:1.45;margin:2px 0 6px;word-break:break-word}
.twi{width:100%;max-height:300px;object-fit:cover;border-radius:16px;border:1px solid var(--line);display:block}
.twa{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;padding:8px 20px 0 0;max-width:300px}
.twa .on{color:#f91880}
.xban{height:120px;background:linear-gradient(135deg,#1d9bf0,#7856ff) center/cover}
.xav{margin:-36px 0 0 14px;display:inline-block;border:3px solid var(--bg);border-radius:50%}
.sr{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.sw{width:48px;height:28px;border-radius:14px;background:#aaa;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#34c759}.sw.on::after{left:22px}
.act-row{padding:14px 18px;border-bottom:1px solid var(--line);color:#0a84ff;cursor:pointer}
.act-row.red{color:#ff3b30}
textarea.big{flex:1;margin:10px 14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font-size:15px;resize:none}
.pbtn{margin:8px 14px 16px;padding:12px;border-radius:12px;background:#0a84ff;color:#fff;font-weight:600;text-align:center;cursor:pointer}
.pbtn.red{background:#ff3b30}.pbtn.gray{background:var(--card);color:var(--fg)}
.fl{padding:8px 16px}.fl label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.fl input,.fl textarea,.fl select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--fg)}
.fl input[type=color]{height:44px;padding:3px}
.fl textarea{min-height:60px;resize:vertical}
.rl{margin:6px 16px;padding:10px;border:1px solid var(--line);border-radius:12px}
.rl .fl{padding:4px 0}
.hint{font-size:12px;color:var(--sub);padding:2px 16px 8px;line-height:1.6}
.sec{padding:14px 16px 4px;font-weight:700}
.stabs{display:flex;gap:6px;padding:6px 16px;overflow:auto}
.stabs button{flex:none;padding:7px 14px;border-radius:16px;background:var(--card);font-size:13px}
.stabs button.on{background:#0a84ff;color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:0 8px}
.cal div{padding:11px 0;font-size:14px;position:relative;cursor:pointer}
.cal .wd{color:var(--sub);font-size:12px;cursor:default}
.cal .dot::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#ff5a7a}
.cal .tod{color:#ff5a7a;font-weight:700}
.dday{text-align:center;padding:26px 0 10px}.dday b{font-size:56px;display:block;color:#ff5a7a}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;font-weight:700}
#modal{position:absolute;inset:0;background:#0007;z-index:70;display:none;align-items:flex-end}
#modal.on{display:flex}
#sheet{background:var(--bg);color:var(--fg);width:100%;max-height:82%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:24px}
#ban{position:absolute;left:10px;right:10px;top:-90px;z-index:80;background:#fffffff2;color:#111;border-radius:18px;padding:12px 14px;box-shadow:0 6px 20px #0004;transition:top .35s;font-size:14px;cursor:pointer}
#ban.on{top:10px}#ban b{display:block;margin-bottom:2px}
#toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
/* ===== 채팅 공통 (v4) ===== */
#thread .body{padding:8px 10px 12px;gap:0;overscroll-behavior:contain}
.bub,.mimg,.imgwrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.38;position:relative}
.ic2{display:flex;flex-direction:column;min-width:0;max-width:74%}
.me .ic2{align-items:flex-end}
.mimg{display:block;max-width:230px;max-height:300px;border-radius:16px;cursor:pointer}
.qt{font-size:12px;border-left:3px solid rgba(0,0,0,.25);padding:2px 8px;margin-bottom:6px;opacity:.85;display:flex;flex-direction:column;max-width:220px}
.qt b{font-size:11px}.qt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx{align-self:flex-start;margin:-8px 0 2px 8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 5px;font-size:14px;position:relative;z-index:1}
.rx.r{align-self:flex-end;margin:-8px 8px 2px 0}
.rbar{display:none;align-items:center;gap:8px;padding:6px 14px;background:var(--card);font-size:13px;border-top:1px solid var(--line);flex:none}
.rbar .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar button{font-size:16px;padding:4px 8px}
.rxrow{display:flex;justify-content:space-around;padding:14px 10px 6px}.rxrow button{font-size:28px}
.act-row.n{color:var(--fg)}
.tday{align-self:center;font-size:11px;color:var(--sub);margin:14px 0 6px}
.seen{align-self:flex-end;font-size:11px;color:var(--sub);margin:3px 6px 4px}
.nm2{font-weight:700;font-size:17px;margin-top:6px}
.ir,.xr,.mr{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.ir.gf,.xr.gf,.mr.gf{margin-top:10px}
.ir.me,.xr.me,.mr.me{justify-content:flex-end}
.iav{width:28px;flex:none}
.iintro,.xintro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 10px 14px;gap:2px}
.xintro{border-bottom:1px solid var(--line);margin-bottom:8px;cursor:pointer}
/* 인스타 */
.ih,.xh{border-bottom:1px solid var(--line)}
.ib{padding:9px 14px;border-radius:22px}
.ime{background:linear-gradient(135deg,#7c3aed,#3797f0);color:#fff}
.iot{background:#efefef;color:#111}.dark .iot{background:#262626;color:#fff}
.ime:not(.f){border-top-right-radius:6px}.ime:not(.l){border-bottom-right-radius:6px}
.iot:not(.f){border-top-left-radius:6px}.iot:not(.l){border-bottom-left-radius:6px}
.iin{display:flex;padding:8px 12px 26px;background:var(--bg)}
.ifield{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:26px;padding:5px 10px 5px 5px}
.icam{width:36px;height:36px;border-radius:50%;background:#3797f0;color:#fff;font-size:16px;flex:none}
.ifield textarea{flex:1;border:0;background:transparent;resize:none;height:24px;max-height:110px;line-height:24px;font-size:15px;padding:0 4px}
#iico{display:flex;gap:10px;font-size:20px}
.isend{display:none;color:#3797f0;font-weight:700;padding:0 6px}
/* X */
.xb{padding:10px 15px;border-radius:22px}
.xme{background:#1d9bf0;color:#fff}.xot{background:#eff3f4;color:#0f1419}.dark .xot{background:#2f3336;color:#e7e9ea}
.xme.l{border-bottom-right-radius:4px}.xot.l{border-bottom-left-radius:4px}
.xt{font-size:11px;color:var(--sub);margin:4px 4px 6px}.xt.r{text-align:right}
.xday{align-self:center;font-size:12px;color:var(--sub);margin:12px 0}
.xin{display:flex;align-items:center;gap:8px;padding:8px 12px 26px;border-top:1px solid var(--line);background:var(--bg)}
.xin>button{font-size:20px;color:#1d9bf0;width:34px}
.xfield{flex:1;background:#eff3f4;border-radius:22px;padding:9px 14px}.dark .xfield{background:#202327}
.xfield textarea{width:100%;border:0;background:transparent;resize:none;height:22px;max-height:110px;font-size:15px;line-height:22px;display:block}
.xsend{opacity:.4}.xsend.on{opacity:1}
/* 메시지(iMessage) */
.mb{padding:9px 14px;border-radius:20px}
.mme{background:#0a84ff;color:#fff}.mot{background:#e9e9eb;color:#000}.dark .mot{background:#26262a;color:#fff}
.mme.l{border-bottom-right-radius:6px}.mot.l{border-bottom-left-radius:6px}
.mh{border-bottom:1px solid var(--line)}
.min{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 24px;border-top:1px solid var(--line);background:var(--bg)}
.mplus{width:34px;height:34px;border-radius:50%;background:var(--card);font-size:22px;color:var(--sub);flex:none}
.mfield{flex:1;display:flex;align-items:flex-end;border:1px solid var(--line);border-radius:20px;padding:5px 5px 5px 14px}
.mfield textarea{flex:1;border:0;background:transparent;resize:none;height:24px;max-height:110px;line-height:24px;font-size:15px}
.msend{width:28px;height:28px;border-radius:50%;background:var(--line);color:#fff;font-size:16px;flex:none}.msend.on{background:#0a84ff}
/* 카카오톡 */
.t-talk{--me:#fee500;--ot:#fff}
.kh{padding:10px 14px;background:var(--bg)}
.kbk{width:42px!important;height:42px;border-radius:50%;background:var(--card);font-size:24px;display:flex;align-items:center;justify-content:center}
.ktitle{font-size:19px;font-weight:800}
.gear{width:42px;font-size:24px;color:#777}
.t-talk .body{background:#b9c7dc;padding:0 10px 10px}
.t-talk .av{border-radius:40%}
.kday{align-self:center;background:rgba(0,0,0,.18);color:#fff;border-radius:14px;padding:4px 14px;font-size:12px;margin:14px 0 6px}
.kr{display:flex;align-items:flex-start;gap:7px;margin-top:3px}
.kr.gf{margin-top:12px}
.kr.me{justify-content:flex-end;align-items:flex-end}
.kav{width:46px;height:46px;flex:none}
.kc{display:flex;flex-direction:column;min-width:0;max-width:calc(100% - 100px)}
.knm{font-size:13px;color:#4b5563;margin:0 0 5px 2px}
.kl{display:flex;align-items:flex-end;gap:5px}
.kr.me .kb{max-width:calc(100% - 70px)}
.kb{padding:10px 14px;border-radius:18px;font-size:16px;color:#111}
.bme{background:var(--me)}.bot{background:var(--ot)}
.kb.first::before{content:"";position:absolute;top:0;width:12px;height:12px;background:inherit}
.kb.bot.first{border-top-left-radius:4px}.kb.bot.first::before{left:-6px;clip-path:polygon(100% 0,100% 100%,0 0)}
.kb.bme.first{border-top-right-radius:4px}.kb.bme.first::before{right:-6px;clip-path:polygon(0 0,100% 0,0 100%)}

/* ===== 소리 ===== */
let AC=null,ringT=null,ringAud=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
document.addEventListener('pointerdown',()=>ac(),{once:true});
function tn(f,t0,d,type,v,f2){
 const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 const vol=Math.max((v||.3)*S.snd.vol,.0002);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function customPlay(src,loop){const a=new Audio(src);a.volume=S.snd.vol;a.loop=!!loop;a.play().catch(()=>{});return a}
function sfx(n,app){
 if(!S.sound)return;
 if(n==='notif'){
  if(S.snd.notif){customPlay(S.snd.notif);return}
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  if(app==='talk'){tn(1046,0,.09,'sine',.35);tn(1568,.1,.14,'sine',.35)}
  else if(app==='insta'){tn(1318,0,.12,'triangle',.3);tn(1760,.11,.2,'triangle',.3)}
  else if(app==='x'){tn(1568,0,.25,'sine',.35)}
  else{tn(1319,0,.12,'sine',.3);tn(1568,.12,.12,'sine',.3);tn(2093,.24,.22,'sine',.3)}
  return;
 }
 if(n==='send'){tn(520,0,.09,'sine',.2,820);return}
 if(n==='connect'){tn(880,0,.1,'sine',.3);tn(1320,.12,.14,'sine',.3);return}
 if(n==='end'){tn(480,0,.18,'square',.12);tn(380,.24,.18,'square',.12);tn(300,.48,.25,'square',.12);return}
 if(n==='tick'){tn(700,0,.05,'sine',.12)}
}
function startRing(kind){
 stopRing();if(!S.sound)return;
 if(S.snd.ring){ringAud=customPlay(S.snd.ring,true);return}
 const once=()=>{
  if(kind==='in'){[659,784,880,784,659,784,880,988].forEach((f,i)=>tn(f,i*.16,.2,'triangle',.28));try{navigator.vibrate&&navigator.vibrate([300,200,300])}catch(e){}}

 ['pointerup','pointercancel','pointerleave'].forEach(ev=>tb.addEventListener(ev,()=>clearTimeout(tmr)));
 tb.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)clearTimeout(tmr)});
 tb.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-i]');if(el){e.preventDefault();clearTimeout(tmr);msgMenu(+el.dataset.i)}});

  return `<div class="kr ${first?'gf':''}">${first?av(c,46):'<div class="kav"></div>'}<div class="kc">${first?`<div class="knm">${esc(c.name)}</div>`:''}<div class="kl">${b}${tm?`<div class="kmeta">${tm}</div>`:''}</div></div></div>`;
 }
 if(app==='insta'){
  const b=bub(m,i,'ib '+(m.me?'ime':'iot')+(first?' f':'')+(last?' l':''));
  const seen=(m.me&&isLast&&!m.u)?`<div class="seen">읽음</div>`:'';
  if(m.me)return `<div class="ir me ${first?'gf':''}"><div class="ic2">${b}${rx}</div></div>${seen}`;
  return `<div class="ir ${first?'gf':''}"><div class="iav">${last?av(c,28):''}</div><div class="ic2">${b}${rx}</div></div>`;
 }
 if(app==='x'){
  const b=bub(m,i,'xb '+(m.me?'xme':'xot')+(last?' l':''));
  const tm=last?`<div class="xt ${m.me?'r':''}">${fmtT(m.t)}${m.me&&isLast&&!m.u?' · 읽음':''}</div>`:'';
  if(m.me)return `<div class="xr me ${first?'gf':''}"><div class="ic2">${b}${rx}${tm}</div></div>`;
  return `<div class="xr ${first?'gf':''}"><div class="iav">${last?av(c,28):''}</div><div class="ic2">${b}${rx}${tm}</div></div>`;
 }
 const b=bub(m,i,'mb '+(m.me?'mme':'mot')+(last?' l':''));
 const seen=(m.me&&isLast&&!m.u)?`<div class="seen">읽음 ${fmtT(m.t)}</div>`:'';
 if(m.me)return `<div class="mr me ${first?'gf':''}"><div class="ic2">${b}${rx}</div></div>${seen}`;
 return `<div class="mr ${first?'gf':''}"><div class="ic2">${b}${rx}</div></div>`;

function drawThread(){
 const {app,cid}=cur;if(!cid)return;const c=C(cid),tb=$('#tb');if(!c||!tb)return;
 const A=chat(app,cid);let h=intro(app,c);
 const G=app==='talk'
  ?(a,b)=>a&&b&&a.me===b.me&&Math.floor(a.t/60000)===Math.floor(b.t/60000)&&sameDay(a.t,b.t)
  :(a,b)=>a&&b&&a.me===b.me&&Math.abs(b.t-a.t)<120000;
 A.forEach((m,i)=>{
  const p=A[i-1],n=A[i+1],first=!G(p,m),last=!G(m,n);
  if(app==='talk'||app==='x'){if(!p||!sameDay(p.t,m.t))h+=`<div class="${app==='talk'?'kday':'xday'}">${app==='talk'?fmtDayW(m.t):fmtDay(m.t)}</div>`}
  else if(!p||m.t-p.t>=20*60000||!sameDay(p.t,m.t))h+=`<div class="tday">${igTime(m.t)}</div>`;
  h+=rowHTML(app,c,m,i,first,last,A);
 });
 tb.innerHTML=h;tb.scrollTop=tb.scrollHeight;
}

/* ===== 자동 답장 (앱별, 소리와 함께 도착) ===== */
/* 내가 만든 답변만 쓰고, 한 번 쓴 답변은 다시 오지 않아요 */
function usedSet(app,cid){S.used=S.used||{};const k=app+'_'+cid;return (S.used[k]=S.used[k]||[])}
function pickReply(c,text,app){
 const used=usedSet(app,c.id),t=String(text||'').toLowerCase(),set=(c.ar&&c.ar[app])||{};
 const free=a=>(a||[]).filter(r=>!used.includes(r));
 let out=null;
 for(const r of [...(set.rules||[]),...(c.rules||[])]){
  if(!(r.k||[]).some(k=>t.includes(String(k).toLowerCase())))continue;
  const f=free(r.r);if(f.length){out=rnd(f);break}
 }
 if(!out){const f=free(set.fallback);if(f.length)out=rnd(f)}
 if(!out){const f=free(c.fallback);if(f.length)out=rnd(f)}
 if(out){used.push(out);save()}
 return out;
}
function markRead(app,cid){
 const A=chat(app,cid);let ch=false;A.forEach(m=>{if(m.me&&m.u){m.u=0;ch=true}});
 if(ch){save();if(viewing(app,cid))drawThread()}
}
function autoReply(app,cid,text){
 if(!S.auto)return;const c=C(cid);if(!c)return;
 const r=pickReply(c,text,app);
 if(!r)return;                                   // 답변을 다 썼으면 읽지 않아요 (1 유지)
 const parts=r.split('|').map(s=>s.trim()).filter(Boolean);
 setTimeout(()=>markRead(app,cid),1000);
 parts.forEach((p,i)=>setTimeout(()=>pushIn(app,cid,p),3000+Math.random()*200+i*1300));
}

function dial(k){dialStr+=k;$('#dnum').textContent=dialStr}
function callDial(){
 const d=dialStr.replace(/\D/g,'');if(!d)return;
 const c=S.contacts.find(c=>(c.phone||'').replace(/\D/g,'')===d)||S.contacts.find(c=>c.name===dialStr);
 if(c)startCall(c.id);else callObj({id:'tmp',name:dialStr,color:'#666',call:[],fallback:[],rules:[]});
}
let CS=null;
function startCall(id){const c=C(id);if(c)callObj(c)}
function setCav(el,c){el.style.background=c.avatar?`url('${c.avatar}') center/cover`:c.color;el.textContent=c.avatar?'':(c.name[0]||'?')}
function callObj(c,connected){
 stopRing();
 CS={c,t0:0,iv:null,lv:null,li:0,to:null};
 show('call');setCav($('#cAv'),c);$('#cName').textContent=c.name;$('#cLines').innerHTML='';
 if(connected){connectCall();return}
 $('#cSt').textContent='연결 중…';startRing('out');
 CS.to=setTimeout(connectCall,3200+Math.random()*2500);
}
function connectCall(){
 if(!CS)return;stopRing();sfx('connect');
 CS.t0=Date.now();
 CS.iv=setInterval(()=>{const s=Math.floor((Date.now()-CS.t0)/1000);$('#cSt').textContent=pad(Math.floor(s/60))+':'+pad(s%60)},500);
 const L=(CS.c.call||[]).filter(Boolean);
 if(!L.length)return;                              // 대사를 안 만들었으면 연결만 유지해요
 const me=CS;
 const next=()=>{
  if(CS!==me)return;
  if(CS.li>=L.length){endCall();return}            // 대사를 다 썼으면 자동으로 끊겨요
  callLine(L[CS.li],0);CS.li++;
  CS.to=setTimeout(next,3000);
 };
 CS.to=setTimeout(next,3000);
}
function callLine(x,me){
 const d=document.createElement('div');if(me)d.className='me';d.textContent=x;$('#cLines').appendChild(d);$('#cLines').scrollTop=1e9;
 if(!me){if(S.snd.tts)speak(x);else sfx('tick')}
}
function callSay(){
 const i=$('#cIn'),x=i.value.trim();if(!x||!CS)return;i.value='';callLine(x,1);
}
function endCall(){
 if(!CS)return;clearTimeout(CS.to);clearInterval(CS.iv);clearInterval(CS.lv);stopRing();
 try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 sfx('end');
 const s=CS.t0?Math.floor((Date.now()-CS.t0)/1000):0;
 S.recents.unshift({id:CS.c.id,name:CS.c.name,type:CS.inc?'in':'out',dur:s?pad(Math.floor(s/60))+':'+pad(s%60):'',t:Date.now()});
 S.recents=S.recents.slice(0,40);save();CS=null;show('phoneApp');
}

function acceptCall(){stopRing();const c=inc;callObj(c,true);CS.inc=1}
function declineCall(){stopRing();sfx('end');S.recents.unshift({id:inc.id,name:inc.name,type:'missed',dur:'',t:Date.now()});save();show('settings')}

let ckTab='alarm',swT0=0,swAcc=0,swRun=false,swLaps=[],tmEnd=0,tmRem=0,tmRun=false,tmSet=[0,5,0],AE=null;
const alarms=()=>(S.alarms=S.alarms||[]);
const CITIES=[['서울','Asia/Seoul'],['도쿄','Asia/Tokyo'],['베이징','Asia/Shanghai'],['런던','Europe/London'],['파리','Europe/Paris'],['뉴욕','America/New_York'],['로스앤젤레스','America/Los_Angeles'],['시드니','Australia/Sydney']];
function renderClock(){
 const T=ckTab;
 $('#clock').innerHTML=`<div class="hd"><button class="bk" onclick="show('home')">‹</button><div class="ti">${{world:'세계 시계',alarm:'알람',sw:'스톱워치',tm:'타이머'}[T]}</div>${T==='alarm'?'<button class="ab on" onclick="editAlarm()">＋</button>':'<span style="width:36px"></span>'}</div><div class="list" id="ckBody"></div>
 <div class="cktabs">${[['world','🌐','세계 시계'],['alarm','⏰','알람'],['sw','⏱️','스톱워치'],['tm','⏳','타이머']].map(a=>`<button class="${T===a[0]?'on':''}" onclick="ckTab='${a[0]}';renderClock()"><span style="font-size:22px">${a[1]}</span>${a[2]}</button>`).join('')}</div>`;
 ckBody();
}
const swFmt=ms=>{const c=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return pad(m)+':'+pad(s)+'.'+pad(c)};
const tmFmt=ms=>{const t=Math.ceil(ms/1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,s=t%60;return (h?h+':':'')+pad(m)+':'+pad(s)};
function ckBody(){
 const b=$('#ckBody');if(!b)return;
 if(ckTab==='world'){
  const now=new Date(),here=now.getTimezoneOffset();
  b.innerHTML=CITIES.map(([n,tz])=>{
   const t=now.toLocaleTimeString('ko-KR',{timeZone:tz,hour:'numeric',minute:'2-digit'});
   const loc=new Date(now.toLocaleString('en-US',{timeZone:tz})),diff=Math.round((loc-new Date(now.toLocaleString('en-US',{timeZone:'Asia/Seoul'})))/36e5);
   return `<div class="ckal"><div><div style="font-size:14px;color:#8e8e93">${diff===0?'오늘, ±0시간':'오늘, '+(diff>0?'+':'')+diff+'시간'}</div><div style="font-size:22px">${n}</div></div><div class="t" style="font-size:38px;font-weight:300">${t}</div></div>`}).join('');
 }else if(ckTab==='alarm'){
  const L=alarms().slice().sort((a,b)=>a.h*60+a.m-b.h*60-b.m);
  b.innerHTML=L.length?L.map(a=>`<div class="ckal ${a.on?'':'off'}" onclick="editAlarm('${a.id}')"><div><div class="t">${a.h<12?'오전':'오후'} ${(a.h%12||12)}:${pad(a.m)}</div><div style="font-size:13px;color:#8e8e93">${esc(a.label||'알람')}${a.days&&a.days.length?', '+a.days.map(d=>DOW[d]).join(' '):''}</div></div><div class="sw ${a.on?'on':''}" onclick="event.stopPropagation();togAlarm('${a.id}')"></div></div>`).join(''):`<div class="empty">설정된 알람이 없어요<br>오른쪽 위 ＋ 버튼으로 추가해보세요</div>`;
 }else if(ckTab==='sw'){
  b.innerHTML=`<div class="ckbig" id="swD">${swFmt(swRun?swAcc+Date.now()-swT0:swAcc)}</div><div style="display:flex;justify-content:space-around;padding:0 30px"><button class="ckbtn" onclick="swLap()">${swRun?'랩':'재설정'}</button><button class="ckbtn ${swRun?'stop':'go'}" onclick="swToggle()">${swRun?'중단':'시작'}</button></div>
  <div style="padding:16px 20px">${swLaps.map((l,i)=>`<div class="ckal" style="padding:10px 0"><span>랩 ${swLaps.length-i}</span><span>${swFmt(l)}</span></div>`).reverse().join('')}</div>`;
 }else{
  if(tmRun||tmRem){
   b.innerHTML=`<div class="ckbig" id="tmD">${tmFmt(tmRun?tmEnd-Date.now():tmRem)}</div><div style="display:flex;justify-content:space-around;padding:0 30px"><button class="ckbtn" onclick="tmCancel()">취소</button><button class="ckbtn ${tmRun?'stop':'go'}" onclick="tmToggle()">${tmRun?'일시정지':'계속'}</button></div>`;
  }else{
   b.innerHTML=`<div style="display:flex;justify-content:center;gap:10px;padding:46px 20px 26px;align-items:end">${['시간','분','초'].map((l,i)=>`<div style="text-align:center"><input type="number" min="0" max="${i?59:23}" value="${tmSet[i]}" onchange="tmSet[${i}]=Math.max(0,Math.min(${i?59:23},+this.value||0))" style="width:84px;font-size:40px;text-align:center;background:#1c1c1e;color:#fff;border:0;border-radius:14px;padding:10px 0"><div style="color:#8e8e93;margin-top:6px">${l}</div></div>`).join('')}</div><div style="display:flex;justify-content:center"><button class="ckbtn go" onclick="tmStart()">시작</button></div>`;
  }
 }
}
function swToggle(){if(swRun){swAcc+=Date.now()-swT0;swRun=false}else{swT0=Date.now();swRun=true}ckBody()}
function swLap(){if(swRun){const t=swAcc+Date.now()-swT0;swLaps.push(t-(swLaps.length?swLaps.reduce((a,b)=>a+b,0):0))}else{swAcc=0;swLaps=[]}ckBody()}
function tmStart(){const t=(tmSet[0]*3600+tmSet[1]*60+tmSet[2])*1000;if(!t){toast('시간을 정해주세요');return}tmRem=t;tmEnd=Date.now()+t;tmRun=true;ckBody()}
function tmToggle(){if(tmRun){tmRem=Math.max(0,tmEnd-Date.now());tmRun=false}else{tmEnd=Date.now()+tmRem;tmRun=true}ckBody()}
function tmCancel(){tmRun=false;tmRem=0;ckBody()}

function drawAE(){
 sheet(`<div class="hd"><div class="ti">${AE.id&&alarms().some(x=>x.id===AE.id)?'알람 편집':'알람 추가'}</div></div>

 <div class="pbtn" onclick="saveAlarm()">저장</div>${alarms().some(x=>x.id===AE.id)?`<div class="pbtn red" onclick="S.alarms=alarms().filter(x=>x.id!=='${AE.id}');save();closeSheet();ckBody()">삭제</div>`:''}`);
}
function alDay(i){collectAE();const k=AE.days.indexOf(i);if(k>=0)AE.days.splice(k,1);else AE.days.push(i);drawAE()}
function collectAE(){const v=($('#alT').value||'07:00').split(':');AE.h=+v[0];AE.m=+v[1];AE.label=$('#alL').value.trim()}
function saveAlarm(){collectAE();AE.on=true;const i=alarms().findIndex(x=>x.id===AE.id);if(i>=0)S.alarms[i]=AE;else S.alarms.push(AE);save();closeSheet();ckBody()}
let lastAlKey='';
function alarmTick(now){
 const d=new Date(now),key=ymd(d)+pad(d.getHours())+pad(d.getMinutes());
 if(key===lastAlKey)return;lastAlKey=key;
 alarms().forEach(a=>{
  if(!a.on||a.h!==d.getHours()||a.m!==d.getMinutes())return;
  if(a.days&&a.days.length&&!a.days.includes(d.getDay()))return;
  if(!a.days||!a.days.length)a.on=false;save();
  ringSheet('⏰',a.label||'알람',(a.h<12?'오전 ':'오후 ')+(a.h%12||12)+':'+pad(a.m));
  if(curScr==='clock'&&ckTab==='alarm')ckBody();
 });
}
setInterval(()=>{

 if(tmRun){const r=tmEnd-now;if(r<=0){tmRun=false;tmFinished()}else{const e=$('#tmD');if(e)e.textContent=tmFmt(r)}}
 alarmTick(now);
},250);

}
function pickSound(kind){
 const i=document.createElement('input');i.type='file';i.accept='audio/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>1.2e6){toast('1.2MB 이하 파일만 쓸 수 있어요');return}
  const r=new FileReader();r.onload=()=>{S.snd[kind]=r.result;S.snd[kind+'Name']=f.name;save();renderSettings();toast('소리를 바꿨어요')};r.readAsDataURL(f)};
 i.click();
}
function resetSound(k){S.snd[k]='';S.snd[k+'Name']='';save();renderSettings()}
function testSound(k){const was=S.sound;S.sound=true;if(k==='notif')sfx('notif','talk');else{startRing('in');setTimeout(stopRing,2600)}S.sound=was}
function togAuto(){S.auto=!S.auto;save();renderSettings()}
function togSound(){S.sound=!S.sound;save();renderSettings();if(S.sound)sndMsg()}
function togDark(){S.dark=!S.dark;save();applyDark();renderSettings()}
function applyDark(){$('#phone').classList.toggle('dark',!!S.dark)}
function testIncomingMsg(){
 if(!S.contacts.length){toast('먼저 연락처를 추가해주세요');return}
 const c=rnd(S.contacts),app=rnd(['msg','talk','insta','x']);
 setTimeout(()=>pushIn(app,c.id,rnd(['지금 뭐해?','나 도착했어!','이따 연락할게','ㅋㅋㅋ 이거 봤어?'])),900);show('home');
}
applyDark();applyWp();drawHome();
</script>
</body>
